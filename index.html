<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dormant Customer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #FAF8F7;
    --surface: #FFFFFF;
    --surface-2: #F3EFEE;
    --border: #E8E1DF;
    --text: #241F1E;
    --text-muted: #7A716E;
    --accent: #A8495A;
    --accent-ink: #FFFFFF;
    --accent-soft: #F3E1E3;
    --success: #2F7A4F;
    --success-soft: #E4F1E8;
    --danger: #B23A3A;
    --danger-soft: #FBE7E6;
    --focus: #A8495A;
    --shadow: 0 1px 2px rgba(36,31,30,0.06), 0 8px 24px -12px rgba(36,31,30,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140F;
      --surface: #211D19;
      --surface-2: #2A2521;
      --border: #3A332D;
      --text: #F2EDE9;
      --text-muted: #A79E97;
      --accent: #E08B96;
      --accent-ink: #241417;
      --accent-soft: #3A2529;
      --success: #7FCB9C;
      --success-soft: #1F3227;
      --danger: #E38686;
      --danger-soft: #3A2323;
      --focus: #E08B96;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140F;
    --surface: #211D19;
    --surface-2: #2A2521;
    --border: #3A332D;
    --text: #F2EDE9;
    --text-muted: #A79E97;
    --accent: #E08B96;
    --accent-ink: #241417;
    --accent-soft: #3A2529;
    --success: #7FCB9C;
    --success-soft: #1F3227;
    --danger: #E38686;
    --danger-soft: #3A2323;
    --focus: #E08B96;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px 16px 48px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 440px; }

  h1 {
    font-family: "Manrope", -apple-system, sans-serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    text-wrap: balance;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  label.field-label {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--text);
    display: block;
    margin-bottom: 8px;
  }

  .phone-input-row {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .phone-prefix {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    color: var(--text-muted);
    padding: 11px 4px 11px 12px;
    display: flex;
    align-items: center;
    user-select: none;
  }
  #phone {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 15px;
    padding: 11px 12px 11px 4px;
    outline: none;
  }
  .phone-input-row:focus-within {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  select#voice {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14.5px;
    color: var(--text);
    background: var(--surface-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="%237A716E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 36px 11px 12px;
    cursor: pointer;
  }
  select#voice:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button#call-btn {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 11px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: opacity 120ms ease, transform 80ms ease;
  }
  button#call-btn:hover { opacity: 0.92; }
  button#call-btn:active { transform: scale(0.99); }
  button#call-btn:disabled { cursor: default; opacity: 0.75; }
  button#call-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .spinner {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2.2px solid rgba(255,255,255,0.4);
    border-top-color: var(--accent-ink);
    animation: spin 0.7s linear infinite;
    display: none;
    flex: none;
  }
  :root[data-theme="dark"] .spinner,
  :root:not([data-theme="light"]) .spinner {
    border: 2.2px solid rgba(36,20,23,0.35);
    border-top-color: var(--accent-ink);
  }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.4s; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  button#call-btn.loading .spinner { display: inline-block; }
  button#call-btn.loading .btn-icon { display: none; }
  .btn-icon { width: 16px; height: 16px; flex: none; }

  #status {
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    display: none;
    flex-direction: column;
    gap: 4px;
  }
  #status.show { display: flex; }
  #status.ok { background: var(--success-soft); color: var(--success); }
  #status.err { background: var(--danger-soft); color: var(--danger); }
  #status.pending { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  #status .status-title { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 13px; color: inherit; }
  #status .status-detail {
    color: var(--text-muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dormant Customer</h1>

  <div class="card">
    <div>
      <label class="field-label" for="phone">Phone number</label>
      <div class="phone-input-row">
        <span class="phone-prefix">+91</span>
        <input id="phone" type="tel" inputmode="numeric" maxlength="10" value="" placeholder="10-digit number" />
      </div>
    </div>

    <div>
      <label class="field-label" for="voice">Agent voice</label>
      <select id="voice">
        <option value="smriti" selected>Smriti</option>
        <option value="daksh">Daksh</option>
        <option value="zara">Zara</option>
        <option value="vihan">Vihan</option>
        <option value="alok">Alok</option>
        <option value="bunty">Bunty</option>
        <option value="anvi">Anvi</option>
        <option value="zina">Zina</option>
        <option value="lucy">Lucy</option>
        <option value="lily">Lily</option>
        <option value="oliver">Oliver</option>
      </select>
    </div>

    <button id="call-btn" type="button">
      <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.6 2.5c.5-.1 1 .1 1.3.5l1.5 2.1c.3.4.3 1 0 1.4L6.2 8.1c.7 1.9 2.2 3.4 4.1 4.1l1.6-1.2c.4-.3 1-.3 1.4 0l2.1 1.5c.4.3.6.8.5 1.3l-.4 1.7c-.2.7-.8 1.1-1.5 1.1C7.9 16.6 3.4 12.1 3.4 6c0-.7.5-1.3 1.1-1.5l.1 0Z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span class="spinner" aria-hidden="true"></span>
      <span id="btn-label">Place call</span>
    </button>

    <div id="status" role="status" aria-live="polite">
      <span class="status-title" id="status-title"></span>
      <span class="status-detail" id="status-detail"></span>
    </div>
  </div>
</div>

<script>
(function () {
  var BASE_URL = "https://entertain-parabola-glaring.ngrok-free.dev/api/v1/voice-bot/call/test/reorder";
  var ACCOUNT_ID = "bd79af44-2a5b-4647-b12a-692dadebbd2f";

  var phoneInput = document.getElementById("phone");
  var callBtn = document.getElementById("call-btn");
  var btnLabel = document.getElementById("btn-label");
  var statusEl = document.getElementById("status");
  var statusTitle = document.getElementById("status-title");
  var statusDetail = document.getElementById("status-detail");

  function showStatus(kind, title, detail) {
    statusEl.className = "show " + kind;
    statusTitle.textContent = title;
    statusDetail.textContent = detail || "";
  }

  function setLoading(isLoading) {
    callBtn.disabled = isLoading;
    callBtn.classList.toggle("loading", isLoading);
    btnLabel.textContent = isLoading ? "Placing call…" : "Place call";
  }

  callBtn.addEventListener("click", function () {
    var digits = (phoneInput.value || "").replace(/\D/g, "");
    if (digits.length !== 10) {
      showStatus("err", "Check the number", "Enter exactly 10 digits, no country code.");
      phoneInput.focus();
      return;
    }
    var voiceValue = document.getElementById("voice").value;

    var url = BASE_URL
      + "?accountId=" + encodeURIComponent(ACCOUNT_ID)
      + "&phoneNumber=" + encodeURIComponent("91" + digits)
      + "&voice=" + encodeURIComponent(voiceValue);

    setLoading(true);
    showStatus("pending", "Placing call…", "");

    fetch(url, {
      method: "GET",
      headers: { "ngrok-skip-browser-warning": "true" }
    })
      .then(function (res) {
        var contentType = res.headers.get("content-type") || "";
        if (contentType.indexOf("application/json") === -1) {
          throw new Error("non-json response (status " + res.status + ") — likely an ngrok interstitial, not the API");
        }
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (result.ok && result.data && result.data.success) {
          showStatus("ok", "Call placed", "callId: " + JSON.stringify(result.data.result));
        } else {
          showStatus("err", "Call request failed", JSON.stringify(result.data));
        }
      })
      .catch(function (err) {
        showStatus(
          "err",
          "Couldn't confirm the result",
          (err && err.message ? err.message : String(err)) + " — the call may still have been placed server-side; a GET request fires even if the browser can't read the response (CORS/interstitial)."
        );
      })
      .finally(function () {
        setLoading(false);
      });
  });
})();
</script>
</body>
</html>
